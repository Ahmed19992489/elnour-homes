<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background (Optional subtle dark) -->
  <rect width="600" height="160" rx="16" fill="#0d0d0d" fill-opacity="0.95"/>

  <!-- Iconic Roof & House Silhouette (Left side) -->
  <g transform="translate(40, 20)">
    <!-- Roof Gable -->
    <path d="M 60 12 L 10 52 L 18 60 L 60 26 L 102 60 L 110 52 Z" fill="url(#goldGrad)"/>
    <!-- Chimney / Accent -->
    <rect x="80" y="22" width="8" height="16" fill="url(#goldGrad)" rx="1"/>
    
    <!-- Interior Furniture Motif (Minimalist Sofa / Console) -->
    <!-- Backrest / Horizon -->
    <rect x="34" y="66" width="52" height="6" rx="3" fill="url(#goldGrad)"/>
    <!-- Cushions / Seats -->
    <rect x="30" y="76" width="28" height="18" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <rect x="62" y="76" width="28" height="18" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Base / Legs -->
    <path d="M 26 98 L 94 98 M 32 98 L 28 110 M 88 98 L 92 110" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Foundation Line -->
    <line x1="12" y1="116" x2="108" y2="116" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Divider Line -->
  <line x1="175" y1="30" x2="175" y2="130" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Brand Typography -->
  <!-- English Title -->
  <text x="205" y="70" font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" font-size="42" font-weight="800" letter-spacing="4" fill="url(#goldGrad)" filter="url(#goldGlow)">
    ELNOUR HOME
  </text>
  
  <!-- Subtitle (English) -->
  <text x="207" y="98" font-family="'Tajawal', sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#E6C665">
    FURNITURE • HOME DECOR • METALWORKS
  </text>
  
  <!-- Arabic Subtitle -->
  <text x="207" y="124" font-family="'Tajawal', sans-serif" font-size="14" font-weight="500" fill="#a0a0a0">
    النور هوم — أرقى تصميمات الأثاث والديكور المعدني
  </text>
</svg>
